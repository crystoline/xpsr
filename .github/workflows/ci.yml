name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The production php.ini (output buffering on, assertions off) is the setup-php default and
  # what deployments use. One extra job runs the development php.ini, where assertions are on.
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        ini: ['production']
        include:
          - php: '8.4'
            ini: 'development'
    name: check (${{ matrix.php }}, ${{ matrix.ini }} php.ini)
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          ini-file: '${{ matrix.ini }}'
          extensions: mbstring, dom, xml, xmlwriter, pcntl, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - name: Validate packages
        run: for package in packages/*; do composer validate --strict --no-check-lock --working-dir="$package"; done
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: find packages app config routes bootstrap public tests scripts -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l
      - run: php -l xpsr
      - name: Tests
        shell: bash
        run: mkdir -p var && composer test -- --log-junit var/junit.xml 2>&1 | tee var/phpunit.log
      - name: Annotate failed tests
        if: failure()
        run: php scripts/ci-annotate.php var/junit.xml var/phpunit.log
      - run: composer analyse
      - run: composer style
      - run: composer audit

  # The whole suite against the lowest versions every constraint allows. PHPUnit fails on
  # deprecations, so a minimum version that is not clean on the PHP version fails here.
  lowest-dependencies:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: mbstring, dom, xml, xmlwriter, pcntl, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress
      - name: Tests
        shell: bash
        run: mkdir -p var && composer test -- --log-junit var/junit.xml 2>&1 | tee var/phpunit.log
      - name: Annotate failed tests
        if: failure()
        run: php scripts/ci-annotate.php var/junit.xml var/phpunit.log

  # The database and Doctrine ORM tests against real servers; the other jobs use SQLite only.
  database:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mysql
            image: 'mysql:8.4'
            url: 'mysql://root:secret@127.0.0.1:3306/xpsr_test'
          - database: mariadb
            image: 'mariadb:11'
            url: 'mysql://root:secret@127.0.0.1:3306/xpsr_test'
          - database: pgsql
            image: 'postgres:17'
            url: 'postgresql://postgres:secret@127.0.0.1:5432/xpsr_test'
    name: database (${{ matrix.database }})
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: xpsr_test
          MARIADB_ROOT_PASSWORD: secret
          MARIADB_DATABASE: xpsr_test
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: xpsr_test
        ports: ['3306:3306', '5432:5432']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, xmlwriter, pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Wait for the server
        run: |
          for i in $(seq 1 60); do
            php -r 'try { new PDO(getenv("DSN"), getenv("USER_NAME"), "secret"); exit(0); } catch (Throwable) { exit(1); }' && exit 0
            sleep 2
          done
          echo "The database server did not start." >&2; exit 1
        env:
          DSN: ${{ matrix.database == 'pgsql' && 'pgsql:host=127.0.0.1;port=5432;dbname=xpsr_test' || 'mysql:host=127.0.0.1;port=3306;dbname=xpsr_test' }}
          USER_NAME: ${{ matrix.database == 'pgsql' && 'postgres' || 'root' }}
      - name: Tests
        shell: bash
        env:
          XPSR_TEST_MYSQL_URL: ${{ matrix.database != 'pgsql' && matrix.url || '' }}
          XPSR_TEST_PGSQL_URL: ${{ matrix.database == 'pgsql' && matrix.url || '' }}
        run: mkdir -p var && vendor/bin/phpunit --testsuite database,orm-doctrine --log-junit var/junit.xml 2>&1 | tee var/phpunit.log
      - name: Annotate failed tests
        if: failure()
        run: php scripts/ci-annotate.php var/junit.xml var/phpunit.log

  # Publishes packages/* and the skeleton to their read-only repositories, after every other
  # job passes. Runs only in crystoline/xpsr (not in forks), on master and on v* tags.
  # Requires the SPLIT_TOKEN secret: a token with contents read/write access to
  # xpsr-framework, xpsr-router-fastroute, xpsr-router-sunrise, xpsr-cache, and xpsr-skeleton.
  # See docs/PACKAGES.md.
  split:
    needs: [check, lowest-dependencies, packaging, database]
    if: >-
      github.event_name == 'push' && github.repository == 'crystoline/xpsr' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    concurrency: split
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Split
        env:
          SPLIT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        run: |
          if [[ -z "$SPLIT_TOKEN" ]]; then echo "SPLIT_TOKEN is not set." >&2; exit 1; fi
          base="https://x-access-token:${SPLIT_TOKEN}@github.com/crystoline"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            scripts/split.sh "$base" master "${GITHUB_REF#refs/tags/}"
          else
            scripts/split.sh "$base" master
          fi

  # Installs each package on its own and builds a project with composer create-project.
  packaging:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: mbstring, dom, xml, xmlwriter, pcntl, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Tests
        shell: bash
        run: mkdir -p var && composer test:packaging -- --log-junit var/junit.xml 2>&1 | tee var/phpunit.log
      - name: Annotate failed tests
        if: failure()
        run: php scripts/ci-annotate.php var/junit.xml var/phpunit.log
